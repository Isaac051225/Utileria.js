<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <!-- Vinculamos el CSS unificado -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="contenedor">
        <h1>Iniciar Sesión</h1>
        <p class="subtitulo">Ingresa tus datos para acceder</p>

        <!-- Formulario de Login -->
        <form id="form-login" onsubmit="return false;">
            
            <!-- Campo de Correo -->
            <div class="grupo-formulario">
                <label for="correo">Correo electrónico :</label>
                <input type="text" id="correo" placeholder="ejemplo@correo.com">
                <div id="error-correo" class="mensaje-error">El correo no tiene un formato válido.</div>
            </div>

            <!-- Campo de Contraseña -->
            <div class="grupo-formulario">
                <label for="password">Contraseña :</label>
                <input type="password" id="password" placeholder="Mínimo 8 caracteres">
                <div id="error-password" class="mensaje-error">La contraseña debe tener +8 caracteres, mayúscula, minúscula, número y especial.</div>
            </div>

            <!-- Mensaje de error general para credenciales incorrectas -->
             <div id="error-general" class="mensaje-error" style="text-align: center; margin-bottom: 10px; display: none;">
                 El correo o la contraseña son incorrectos.
                </div>

            <!-- Botón de Ingreso -->
            <div class="grupo-formulario">
                <button type="button" id="btn-login" class="boton-accion">Ingresar</button>
            </div>

            <!-- Mensaje de Éxito -->
            <div id="exito-msg" class="mensaje-exito" style="text-align: center; font-weight: bold;">
                ¡Inicio de sesión exitoso!
            </div>
        </form>
    </div>

    <!-- Ventana Modal de Éxito para el Login -->
    <div id="modalLogin" class="modal">
        <div class="modal-contenido modal-login-contenido">
            <h3>¡Bienvenido!</h3>
            <p>Inicio de sesión exitoso.</p>
        </div>
    </div>


    <!-- 1. Importamos tu librería con las funciones -->
    <script src="js/utileria.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
